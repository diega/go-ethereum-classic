name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-latest }
          - { os: linux, arch: arm64, runner: ubuntu-latest, cc: aarch64-linux-gnu-gcc }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-latest }
          - { os: windows, arch: amd64, runner: windows-latest }

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install ARM64 cross-compiler
        if: matrix.arch == 'arm64' && matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            go run build/ci.go install -arch ${{ matrix.arch }} -cc ${{ matrix.cc }}
          else
            go run build/ci.go install -arch ${{ matrix.arch }}
          fi

      - name: Create archive
        shell: bash
        run: |
          # Format: geth-{os}-{arch}-{version}-{commit}.tar.gz
          VERSION=${GITHUB_REF_NAME#v}  # Remove 'v' prefix
          COMMIT=${GITHUB_SHA::8}
          BASENAME="geth-${{ matrix.os }}-${{ matrix.arch }}-${VERSION}-${COMMIT}"
          cd build/bin
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a "../../${BASENAME}.zip" geth.exe
          else
            tar -czvf "../../${BASENAME}.tar.gz" geth
          fi

      - name: Generate checksum
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=${GITHUB_SHA::8}
          BASENAME="geth-${{ matrix.os }}-${{ matrix.arch }}-${VERSION}-${COMMIT}"
          if [ "${{ matrix.os }}" = "windows" ]; then FILE="${BASENAME}.zip"; else FILE="${BASENAME}.tar.gz"; fi
          if [[ "$OSTYPE" == "darwin"* ]]; then
            shasum -a 256 "$FILE" > "${FILE}.sha256"
          else
            sha256sum "$FILE" > "${FILE}.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: geth-${{ matrix.os }}-${{ matrix.arch }}
          path: geth-*.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums.txt
        run: cat artifacts/*.sha256 > artifacts/checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
